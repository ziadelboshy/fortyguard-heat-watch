name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  n8n-workflows:
    name: n8n code and workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Unit and workflow tests (node --test)
        run: npm test
      - name: Workflow files are built from n8n/src
        run: python scripts/build_workflows.py --check
      - name: Workflow structure and secret checks
        run: python scripts/check_workflows.py
      - name: Script tests (setup, export, secret checks)
        run: python -m unittest discover -s scripts -t scripts -v

  planner:
    name: Planner tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests
        run: python -m unittest discover -s planner -t planner -v

  lint:
    name: Lint (ruff, shellcheck, compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: ruff
        run: |
          python -m pip install --disable-pip-version-check ruff==0.17.4
          ruff check .
          ruff format --check .
      - name: shellcheck
        run: shellcheck scripts/*.sh
      - name: Compose file is valid
        run: docker compose config --quiet
